name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:
      - uses: actions/checkout@v4

      # ── Node.js 18 (Cordova 8.x 兼容) ─────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ── JDK 17 默认 (SDK 工具用) ───────────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── JDK 8 (仅 Cordova/Gradle 构建用) ──────────
      - name: Setup JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Lock JAVA_HOME to JDK 17 + save JDK 8 path
        run: |
          echo "JDK8_HOME=$JAVA_HOME_8_X64" >> $GITHUB_ENV
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV

      # ── 安装 Pillow ────────────────────────────────
      - name: Install Pillow
        run: pip install --quiet "Pillow==10.4.0"

      # ── Android SDK 手动安装 ───────────────────────
      - name: Setup Android SDK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
          unzip -q commandlinetools-linux-10406996_latest.zip
          mv cmdline-tools tools
          rm commandlinetools-linux-10406996_latest.zip

          BIN=$ANDROID_HOME/cmdline-tools/tools/bin
          echo "$BIN" >> $GITHUB_PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          export PATH="$BIN:$PATH"

          "$BIN/sdkmanager" --version

      - name: Install SDK packages
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          BIN=$ANDROID_HOME/cmdline-tools/tools/bin
          yes | "$BIN/sdkmanager" --licenses >/dev/null
          "$BIN/sdkmanager" "platform-tools" "platforms;android-28" "build-tools;28.0.3"

      # ── Cordova ────────────────────────────────────
      - name: Install Cordova
        run: npm install -g cordova@8.1.2

      - name: Init Cordova project
        run: |
          cordova create app com.zxkitcar.sim ZX_KitCar_Sim
          cp www/* app/www/ 2>/dev/null || true

      # ── ✅ 关键修复：图标生成在 cordova create 之后 ──
      - name: Generate icons & splash into app/res/
        working-directory: app
        run: |
          mkdir -p res/icon/android res/screen/android
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw
          import os

          # --- Icons ---
          sizes = {'ldpi': 36, 'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144}
          for density, size in sizes.items():
              img = Image.new('RGBA', (size, size), (26, 26, 26, 255))
              d = ImageDraw.Draw(img)
              m = size // 6
              d.rounded_rectangle([m, size//3, size-m, size*2//3],
                                  radius=size//8, fill=(200, 200, 0, 255))
              cl, cr = size//3, size*2//3
              d.polygon([(cl, size//3), (cr, size//3),
                         (cr-size//8, m), (cl+size//8, m)],
                        fill=(255, 255, 80, 255))
              wr = size // 8
              for wx in [size//4, size*3//4]:
                  wy = size*2//3
                  d.ellipse([wx-wr, wy-wr//2, wx+wr, wy+wr//2], fill=(30,30,30,255))
                  d.ellipse([wx-wr//2, wy-wr//3, wx+wr//2, wy+wr//3], fill=(150,150,150,255))
              fname = f"res/icon/android/{density}.png"
              img.save(fname)
              print(f'Icon: {fname} ({size}x{size})')

          # --- Splash screens ---
          specs = [('mdpi',320,480),('hdpi',480,800),('xhdpi',720,1280),('xxhdpi',1080,1920)]
          for density, w, h in specs:
              img = Image.new('RGBA', (w, h), (26, 26, 46, 255))
              d = ImageDraw.Draw(img)
              cx, cy = w//2, h//3
              d.rounded_rectangle([cx-w//4, cy-h//8, cx+w//4, cy+h//8],
                                  radius=h//16, fill=(0,200,200,255))
              car_y = h//2; cw = w//3; cx0 = cx - cw//2
              d.rounded_rectangle([cx0, car_y, cx0+cw, car_y+cw//3],
                                  radius=cw//8, fill=(200,200,0,255))
              d.polygon([(cx0+cw//4,car_y),(cx0+cw*3//4,car_y),
                         (cx0+cw*5//8,car_y-cw//4),(cx0+cw*3//8,car_y-cw//4)],
                        fill=(255,255,80,255))
              for wx in [cx0+cw//4, cx0+cw*3//4]:
                  r = cw//8
                  d.ellipse([wx-r, car_y+cw//4-r, wx+r, car_y+cw//4+r], fill=(30,30,30,255))
              d.rectangle([0, h*3//4, w, h], fill=(20,20,20,255))
              fname = f"res/screen/android/splash-{density}.png"
              img.save(fname)
              print(f'Splash: {fname} ({w}x{h})')

          print("Done!")
          PYEOF

      # ── 验证图标文件存在 ──────────────────────────
      - name: Verify icon files
        working-directory: app
        run: |
          ls -la res/icon/android/
          test -f res/icon/android/hdpi.png && echo "✅ hdpi.png exists" || (echo "❌ missing"; exit 1)

      - name: Add Android platform
        working-directory: app
        run: cordova platform add android@8.1.0

      # ── Build (仅这一步切 JDK 8) ─────────────────
      - name: Build Debug APK
        working-directory: app
        run: cordova build android --debug
        env:
          JAVA_HOME: ${{ env.JDK8_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Build Release APK
        working-directory: app
        run: cordova build android --release
        env:
          JAVA_HOME: ${{ env.JDK8_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── Upload artifacts (v4) ─────────────────────
      - uses: actions/upload-artifact@v4
        with:
          name: zx-kitcar-debug-apk
          path: app/platforms/android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zx-kitcar-release-apk
          path: app/platforms/android/app/build/outputs/apk/release/*.apk
