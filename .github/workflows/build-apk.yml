name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:
      - uses: actions/checkout@v4

      # ── Node.js 18 ───────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ── JDK 17 默认 (SDK 工具用) ────────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── JDK 8 (Cordova/Gradle 用) ──────────────
      - name: Setup JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Lock JAVA_HOME + save JDK 8
        run: |
          echo "JDK8_HOME=$JAVA_HOME_8_X64" >> $GITHUB_ENV
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV

      # ── 安装 Gradle 4.10.3 ─────────────────────
      - name: Install Gradle 4.10.3
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
          sudo unzip -q gradle-4.10.3-bin.zip -d /opt/
          echo "/opt/gradle-4.10.3/bin" >> $GITHUB_PATH
          export PATH="/opt/gradle-4.10.3/bin:$PATH"
          gradle -v
          rm gradle-4.10.3-bin.zip

      # ── 安装 Pillow ──────────────────────────────
      - name: Install Pillow
        run: pip install --quiet "Pillow==10.4.0"

      # ── Android SDK ──────────────────────────────
      - name: Setup Android SDK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
          unzip -q commandlinetools-linux-10406996_latest.zip
          mv cmdline-tools tools
          rm commandlinetools-linux-10406996_latest.zip
          BIN=$ANDROID_HOME/cmdline-tools/tools/bin
          echo "$BIN" >> $GITHUB_PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          export PATH="$BIN:$PATH"
          "$BIN/sdkmanager" --version

      - name: Install SDK packages
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          BIN=$ANDROID_HOME/cmdline-tools/tools/bin
          yes | "$BIN/sdkmanager" --licenses >/dev/null
          "$BIN/sdkmanager" "platform-tools" "platforms;android-28" "build-tools;28.0.3"

      # ── Cordova ─────────────────────────────────
      - name: Install Cordova
        run: npm install -g cordova@8.1.2

      - name: Init Cordova project
        run: |
          cordova create app com.zxkitcar.sim ZX_KitCar_Sim
          mkdir -p app/www
          cp www/* app/www/ 2>/dev/null || true
          cp index.html app/www/ 2>/dev/null || true
          cp game.js app/www/ 2>/dev/null || true

      # ── 生成图标/启动屏 ────────────────────────
      - name: Generate icons & splash
        working-directory: app
        run: |
          mkdir -p res/icon/android res/screen/android
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw
          sizes = {'ldpi':36,'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144}
          for d,s in sizes.items():
              img=Image.new('RGBA',(s,s),(26,26,26,255)); dr=ImageDraw.Draw(img); m=s//6
              dr.rounded_rectangle([m,s//3,s-m,s*2//3],radius=s//8,fill=(200,200,0,255))
              dr.polygon([(s//3,s//3),(s*2//3,s//3),(s*2//3-s//8,m),(s//3+s//8,m)],fill=(255,255,80,255))
              for wx in [s//4,s*3//4]:
                  dr.ellipse([wx-s//8,s*2//3-s//16,wx+s//8,s*2//3+s//16],fill=(30,30,30,255))
              img.save(f"res/icon/android/{d}.png")
          for d,w,h in [('mdpi',320,480),('hdpi',480,800),('xhdpi',720,1280),('xxhdpi',1080,1920)]:
              img=Image.new('RGBA',(w,h),(26,26,46,255)); dr=ImageDraw.Draw(img)
              cx,cy=w//2,h//3
              dr.rounded_rectangle([cx-w//4,cy-h//8,cx+w//4,cy+h//8],radius=h//16,fill=(0,200,200,255))
              cw=w//3; cx0=cx-cw//2; cy2=h//2
              dr.rounded_rectangle([cx0,cy2,cx0+cw,cy2+cw//3],radius=cw//8,fill=(200,200,0,255))
              dr.polygon([(cx0+cw//4,cy2),(cx0+cw*3//4,cy2),(cx0+cw*5//8,cy2-cw//4),(cx0+cw*3//8,cy2-cw//4)],fill=(255,255,80,255))
              for wx in [cx0+cw//4,cx0+cw*3//4]:
                  r=cw//8; dr.ellipse([wx-r,cy2+cw//4-r,wx+r,cy2+cw//4+r],fill=(30,30,30,255))
              dr.rectangle([0,h*3//4,w,h],fill=(20,20,20,255))
              img.save(f"res/screen/android/splash-{d}.png")
          print("Done!")
          PYEOF

      - name: Add Android platform
        working-directory: app
        run: cordova platform add android@8.1.0

      # ── ✅ 核心修复：Patch Gradle 脚本移除 jcenter/bintray ──
      - name: Patch Gradle build scripts (remove jcenter/bintray)
        working-directory: app/platforms/android
        run: |
          echo "=== 修复前 CordovaLib/build.gradle ==="
          head -20 CordovaLib/build.gradle 2>/dev/null || true

          # 1. 注释掉 bintray 插件引用
          find . -name "build.gradle" -exec sed -i 's/^.*bintray.*$/\/\/ REMOVED bintray plugin/' {} \;

          # 2. 替换 jcenter() 为 mavenCentral() + google()
          find . -name "build.gradle" -exec sed -i 's/jcenter()/mavenCentral()\ngoogle()/g' {} \;
          find . -name "*.gradle" -exec sed -i 's/jcenter()/mavenCentral()\ngoogle()/g' {} \;

          # 3. 移除 classpath bintray 依赖
          find . -name "build.gradle" -exec sed -i '/gradle-bintray-plugin/d' {} \;

          # 4. 在根 build.gradle 的 repositories 里确保有 google() + mavenCentral()
          #    并对所有 project 都生效
          cat > /tmp/init.gradle << 'INITEOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://maven.google.com" }
              }
          }
          INITEOF

          echo "=== 修复后 CordovaLib/build.gradle ==="
          head -20 CordovaLib/build.gradle 2>/dev/null || true

      # ── 强制 Gradle wrapper 版本 ───────────────
      - name: Fix Gradle wrapper
        working-directory: app/platforms/android
        run: |
          GW=gradle/wrapper/gradle-wrapper.properties
          if [ -f "$GW" ]; then
            sed -i 's/gradle-[0-9.]*-/gradle-4.10.3-/g' "$GW"
            sed -i 's|https://services.gradle.org/distributions/gradle-.*-bin.zip|https://services.gradle.org/distributions/gradle-4.10.3-bin.zip|g' "$GW"
            cat "$GW"
          fi

      # ── Build Debug ─────────────────────────────
      - name: Build Debug APK
        working-directory: app
        run: |
          export JAVA_HOME="$JAVA_HOME_8_X64"
          export PATH="/opt/gradle-4.10.3/bin:$PATH"
          cd platforms/android
          ./gradlew assembleDebug --no-daemon --init-script /tmp/init.gradle \
            -Pandroid.useDeprecatedNdk=true 2>&1 | tail -50
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── Build Release ───────────────────────────
      - name: Build Release APK
        working-directory: app
        run: |
          export JAVA_HOME="$JAVA_HOME_8_X64"
          export PATH="/opt/gradle-4.10.3/bin:$PATH"
          cd platforms/android
          ./gradlew assembleRelease --no-daemon --init-script /tmp/init.gradle \
            -Pandroid.useDeprecatedNdk=true 2>&1 | tail -50
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── 定位 APK ────────────────────────────────
      - name: Locate and rename APKs
        run: |
          mkdir -p artifacts
          echo "=== 查找所有 APK ==="
          find app/platforms -name "*.apk" 2>/dev/null | tee apk-list.txt

          DBG=$(find app/platforms -name "*debug*.apk" | head -1)
          if [ -n "$DBG" ]; then
            cp "$DBG" artifacts/zx-kitcar-sim-v6.0-debug.apk
            echo "✅ Debug: $DBG"
          fi

          REL=$(find app/platforms -name "*release*.apk" | head -1)
          if [ -n "$REL" ]; then
            cp "$REL" artifacts/zx-kitcar-sim-v6.0-release-unsigned.apk
            echo "✅ Release: $REL"
          fi

          ls -la artifacts/

      # ── Upload ───────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zx-kitcar-debug-apk
          path: artifacts/zx-kitcar-sim-v6.0-debug.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: zx-kitcar-release-apk
          path: artifacts/zx-kitcar-sim-v6.0-release-unsigned.apk
          if-no-files-found: warn

      # ── GitHub Release ──────────────────────────
      - name: Package for Release
        if: startsWith(github.ref, 'refs/tags/')
        run: cd artifacts && zip zx-kitcar-sim-v6.0-android.zip *.apk || true

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/zx-kitcar-sim-v6.0-android.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
