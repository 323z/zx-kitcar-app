name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /home/runner/android-sdk

    steps:
      # ═════════════════════════════════════════════
      # 1. Checkout
      # ═════════════════════════════════════════════
      - uses: actions/checkout@v4

      # ═════════════════════════════════════════════
      # 2. Node.js 18
      # ═════════════════════════════════════════════
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ═════════════════════════════════════════════
      # 3. JDK 17 (SDK tools + Gradle)
      # ═════════════════════════════════════════════
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # ═════════════════════════════════════════════
      # 4. Install Gradle 4.10.3
      # ═════════════════════════════════════════════
      - name: Install Gradle 4.10.3
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
          sudo unzip -q gradle-4.10.3-bin.zip -d /opt/
          export PATH="/opt/gradle-4.10.3/bin:$PATH"
          gradle -v
          rm /tmp/gradle-4.10.3-bin.zip
        env:
          PATH: /opt/gradle-4.10.3/bin:${{ env.PATH }}

      # ═════════════════════════════════════════════
      # 5. Install Pillow
      # ═════════════════════════════════════════════
      - name: Install Pillow
        run: pip install --quiet "Pillow==10.4.0"

      # ═════════════════════════════════════════════
      # 6. Setup Android SDK
      # ═════════════════════════════════════════════
      - name: Setup Android SDK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
          unzip -q commandlinetools-linux-10406996_latest.zip
          mv cmdline-tools tools
          rm commandlinetools-linux-10406996_latest.zip

          BIN=$ANDROID_HOME/cmdline-tools/tools/bin
          echo "$BIN" >> $GITHUB_PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          export PATH="$BIN:$PATH"

          echo "=== sdkmanager version ==="
          "$BIN/sdkmanager" --version

      - name: Install SDK packages
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          BIN=$ANDROID_HOME/cmdline-tools/tools/bin
          echo "=== Accepting licenses ==="
          yes | "$BIN/sdkmanager" --licenses >/dev/null 2>&1
          echo "=== Installing SDK packages ==="
          "$BIN/sdkmanager" "platform-tools" "platforms;android-28" "build-tools;28.0.3"
          echo "=== Installed packages ==="
          "$BIN/sdkmanager" --list_installed 2>/dev/null || true

      # ═════════════════════════════════════════════
      # 7. Install Cordova
      # ═════════════════════════════════════════════
      - name: Install Cordova
        run: |
          npm install -g cordova@8.1.2 2>&1 | tail -5
          cordova -v

      # ═════════════════════════════════════════════
      # 8. Create Cordova project
      # ═════════════════════════════════════════════
      - name: Create Cordova project
        run: |
          cordova create app com.zxkitcar.sim ZXSim
          echo "=== Copying web assets ==="
          mkdir -p app/www
          cp www/index.html app/www/
          cp www/game.js app/www/
          echo "=== app/www/ ==="
          ls -la app/www/

      # ═════════════════════════════════════════════
      # 9. Generate icons & splash
      # ═════════════════════════════════════════════
      - name: Generate icons & splash
        working-directory: app
        run: |
          mkdir -p res/icon/android res/screen/android
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw
          sizes = {'ldpi':36,'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144}
          for d,s in sizes.items():
              img=Image.new('RGBA',(s,s),(26,26,26,255))
              dr=ImageDraw.Draw(img); m=s//6
              dr.rounded_rectangle([m,s//3,s-m,s*2//3],radius=s//8,fill=(200,200,0,255))
              dr.polygon([(s//3,s//3),(s*2//3,s//3),(s*2//3-s//8,m),(s//3+s//8,m)],fill=(255,255,80,255))
              for wx in [s//4,s*3//4]:
                  dr.ellipse([wx-s//8,s*2//3-s//16,wx+s//8,s*2//3+s//16],fill=(30,30,30,255))
              img.save(f"res/icon/android/{d}.png")
          for d,w,h in [('mdpi',320,480),('hdpi',480,800),('xhdpi',720,1280),('xxhdpi',1080,1920)]:
              img=Image.new('RGBA',(w,h),(26,26,46,255)); dr=ImageDraw.Draw(img)
              cx,cy=w//2,h//3
              dr.rounded_rectangle([cx-w//4,cy-h//8,cx+w//4,cy+h//8],radius=h//16,fill=(0,200,200,255))
              cw=w//3; cx0=cx-cw//2; cy2=h//2
              dr.rounded_rectangle([cx0,cy2,cx0+cw,cy2+cw//3],radius=cw//8,fill=(200,200,0,255))
              dr.polygon([(cx0+cw//4,cy2),(cx0+cw*3//4,cy2),(cx0+cw*5//8,cy2-cw//4),(cx0+cw*3//8,cy2-cw//4)],fill=(255,255,80,255))
              for wx in [cx0+cw//4,cx0+cw*3//4]:
                  r=cw//8; dr.ellipse([wx-r,cy2+cw//4-r,wx+r,cy2+cw//4+r],fill=(30,30,30,255))
              dr.rectangle([0,h*3//4,w,h],fill=(20,20,20,255))
              img.save(f"res/screen/android/splash-{d}.png")
          print("Done!")
          PYEOF
          echo "=== icons ==="; ls -la res/icon/android/
          echo "=== splash ==="; ls -la res/screen/android/

      # ═════════════════════════════════════════════
      # 10. Add Android platform
      # ═════════════════════════════════════════════
      - name: Add Android platform
        working-directory: app
        run: |
          cordova platform add android@8.1.0 2>&1 | tail -20
          echo "=== platforms/android/ ==="
          ls -la platforms/android/ 2>/dev/null || true

      # ═════════════════════════════════════════════
      # 11. Patch Gradle scripts (remove jcenter/bintray)
      # ═════════════════════════════════════════════
      - name: Patch Gradle build scripts
        working-directory: app/platforms/android
        run: |
          echo "=== Patching: remove bintray/jcenter ==="
          # Comment out bintray plugin apply lines
          find . -name "*.gradle" -exec sed -i 's|^.*apply.*plugin.*bintray.*$|// &|g' {} \;
          # Comment out bintray classpath
          find . -name "*.gradle" -exec sed -i 's|^.*com\.jfrog\.bintray.*$|// &|g' {} \;
          # Remove bintray plugin line
          find . -name "*.gradle" -exec sed -i '/gradle-bintray-plugin/d' {} \;
          # Replace jcenter() with mavenCentral() + google()
          find . -name "*.gradle" -exec sed -i 's|jcenter()|mavenCentral()\ngoogle()|g' {} \;

          # Fix gradle wrapper properties
          GW=gradle/wrapper/gradle-wrapper.properties
          if [ -f "$GW" ]; then
            sed -i 's|gradle-[0-9.]*-bin\.zip|gradle-4.10.3-bin.zip|g' "$GW"
            sed -i 's|gradle-[0-9.]*-all\.zip|gradle-4.10.3-bin.zip|g' "$GW"
            sed -i 's|https://services.gradle.org/distributions/gradle-[^"]*|https://services.gradle.org/distributions/gradle-4.10.3-bin.zip|g' "$GW"
            echo "=== $GW ==="
            cat "$GW"
          fi

          echo "=== CordovaLib/build.gradle (first 40 lines) ==="
          head -40 CordovaLib/build.gradle 2>/dev/null || true

      # ═════════════════════════════════════════════
      # 12. Create init.gradle
      # ═════════════════════════════════════════════
      - name: Create init.gradle
        run: |
          cat > /tmp/init.gradle << 'INITEOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://maven.google.com" }
              }
              buildscript {
                  repositories {
                      google()
                      mavenCentral()
                      maven { url "https://maven.google.com" }
                  }
              }
          }
          INITEOF
          echo "=== init.gradle ==="
          cat /tmp/init.gradle

      # ═════════════════════════════════════════════
      # 13. Build Debug APK
      # ═════════════════════════════════════════════
      - name: Build Debug APK
        working-directory: app/platforms/android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="/opt/gradle-4.10.3/bin:$PATH"
          export ANDROID_HOME="$HOME/android-sdk"

          echo "=== Java version ==="
          java -version 2>&1
          echo "=== Gradle version ==="
          gradle -v 2>&1 | head -5

          echo "=== Running: gradlew assembleDebug ==="
          ./gradlew assembleDebug \
            --no-daemon \
            --init-script /tmp/init.gradle \
            --stacktrace \
            2>&1 | tail -100

          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null | while read f; do
            echo "FOUND: $f ($(du -h "$f" | cut -f1))"
          done
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ═════════════════════════════════════════════
      # 14. Build Release APK
      # ═════════════════════════════════════════════
      - name: Build Release APK
        working-directory: app/platforms/android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="/opt/gradle-4.10.3/bin:$PATH"
          export ANDROID_HOME="$HOME/android-sdk"

          echo "=== Running: gradlew assembleRelease ==="
          ./gradlew assembleRelease \
            --no-daemon \
            --init-script /tmp/init.gradle \
            --stacktrace \
            2>&1 | tail -100

          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null | while read f; do
            echo "FOUND: $f ($(du -h "$f" | cut -f1))"
          done
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ═════════════════════════════════════════════
      # 15. Collect ALL APK files
      # ═════════════════════════════════════════════
      - name: Collect APK files
        id: collect
        run: |
          mkdir -p artifacts

          echo "=== FULL FILESYSTEM SEARCH for APK ==="
          find . -name "*.apk" -type f 2>/dev/null | sort | while read f; do
            echo "FOUND: $f ($(du -h "$f" | cut -f1))"
          done

          # Collect ALL apk files with simple names
          DBG_COUNT=0
          REL_COUNT=0

          find . -name "*.apk" -type f 2>/dev/null | while read f; do
            fname=$(basename "$f")
            if echo "$fname" | grep -qi "debug"; then
              cp "$f" "artifacts/zx-kitcar-sim-v6.0-debug.apk" 2>/dev/null || true
              echo "✅ Copied debug: $f → artifacts/zx-kitcar-sim-v6.0-debug.apk"
            elif echo "$fname" | grep -qi "release"; then
              cp "$f" "artifacts/zx-kitcar-sim-v6.0-release-unsigned.apk" 2>/dev/null || true
              echo "✅ Copied release: $f → artifacts/zx-kitcar-sim-v6.0-release-unsigned.apk"
            else
              # Unknown APK - copy with original name
              cp "$f" "artifacts/$(basename "$f")" 2>/dev/null || true
              echo "✅ Copied other: $f → artifacts/$(basename "$f")"
            fi
          done

          echo ""
          echo "=== artifacts/ directory ==="
          ls -lh artifacts/ 2>/dev/null || echo "(empty - no APK found)"

          # Set output for downstream steps
          if [ -f "artifacts/zx-kitcar-sim-v6.0-debug.apk" ]; then
            echo "has_debug=true" >> $GITHUB_OUTPUT
          else
            echo "has_debug=false" >> $GITHUB_OUTPUT
          fi
          if [ -f "artifacts/zx-kitcar-sim-v6.0-release-unsigned.apk" ]; then
            echo "has_release=true" >> $GITHUB_OUTPUT
          else
            echo "has_release=false" >> $GITHUB_OUTPUT
          fi

      # ═════════════════════════════════════════════
      # 16. Upload Debug APK
      # ═════════════════════════════════════════════
      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx-kitcar-debug-apk
          path: artifacts/zx-kitcar-sim-v6.0-debug.apk
          if-no-files-found: warn
          retention-days: 30

      # ═════════════════════════════════════════════
      # 17. Upload Release APK
      # ═════════════════════════════════════════════
      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx-kitcar-release-apk
          path: artifacts/zx-kitcar-sim-v6.0-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 30

      # ═════════════════════════════════════════════
      # 18. Upload ALL artifacts (catch-all)
      # ═════════════════════════════════════════════
      - name: Upload all artifacts (catch-all)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx-kitcar-all-files
          path: |
            artifacts/
            app/platforms/android/app/build/outputs/
            app/platforms/android/build/outputs/
          if-no-files-found: warn
          retention-days: 7

      # ═════════════════════════════════════════════
      # 19. Build logs on failure
      # ═════════════════════════════════════════════
      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-debug
          path: |
            app/platforms/android/build/
            app/platforms/android/app/build/
            app/platforms/android/**/*.log
          if-no-files-found: ignore
          retention-days: 7

      # ═════════════════════════════════════════════
      # 20. GitHub Release (tag only)
      # ═════════════════════════════════════════════
      - name: Package for GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd artifacts
          if ls *.apk >/dev/null 2>&1; then
            zip zx-kitcar-sim-v6.0-android.zip *.apk
            echo "✅ Release zip created"
            ls -lh zx-kitcar-sim-v6.0-android.zip
          else
            echo "❌ No APK to package"
            exit 1
          fi

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/zx-kitcar-sim-v6.0-android.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ═════════════════════════════════════════════
      # 21. Build Summary
      # ═════════════════════════════════════════════
      - name: Build Summary
        if: always()
        run: |
          echo "============================================"
          echo "  Citroen ZX Kit Car Rally Sim v6.0"
          echo "  Build Complete!"
          echo "============================================"
          echo ""
          echo "APK Files:"
          if [ -f artifacts/zx-kitcar-sim-v6.0-debug.apk ]; then
            echo "  ✅ Debug APK: $(du -h artifacts/zx-kitcar-sim-v6.0-debug.apk | cut -f1)"
          else
            echo "  ❌ Debug APK: NOT FOUND"
          fi
          if [ -f artifacts/zx-kitcar-sim-v6.0-release-unsigned.apk ]; then
            echo "  ✅ Release APK: $(du -h artifacts/zx-kitcar-sim-v6.0-release-unsigned.apk | cut -f1)"
          else
            echo "  ❌ Release APK: NOT FOUND"
          fi
          echo ""
          echo "Download from: GitHub Actions → Artifacts"
          echo "============================================"
          echo ""
          echo "=== Full APK search (for debugging) ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found anywhere"
