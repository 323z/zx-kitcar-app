# ============================================================
#  GitHub Actions — Auto-build Android APK
#  Citroen ZX Kit Car Rally Sim v6.0
#  Compatible with Android 4.4.4+ (API 19)
#  Cordova 8.1.2 + Cordova-Android 8.1.0
#  Ubuntu Latest Runner (Node 24)
# ============================================================
#
#  ALL ERRORS FIXED (2025-2026 compat):
#    ✅ Node 20 deprecated → ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION=true
#    ✅ setup-java@v4 deprecated → @v5
#    ✅ 'java-home-output-variable' removed (not a valid v4/v5 input)
#    ✅ JDK 8 path captured via $JAVA_HOME_8_X64 env var (set by setup-java)
#    ✅ JAVA_HOME forced to JDK 17 BEFORE Android SDK steps
#    ✅ sdkmanager PATH exported inline + GITHUB_PATH for cross-step
#    ✅ upload-artifact@v4 (no v3 deprecation)
#    ✅ softprops/action-gh-release@v2
# ============================================================

name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_API:         28
  ANDROID_BUILD_TOOLS: '28.0.3'
  MIN_SDK:             19
  CORDOVA_VERSION:      '8.1.2'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    # ============================================================
    #  STEP 1  —  Checkout
    # ============================================================
    - name: Checkout repository
      uses: actions/checkout@v4

    # ============================================================
    #  STEP 2  —  Setup Node.js
    #  Node 5.8 is not available on Node 24 runners.
    #  Use Node 18 LTS (last version that can run Cordova 8.x tooling).
    #  Set ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION to suppress warnings.
    # ============================================================
    - name: Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Verify Node.js
      run: |
        node --version
        npm --version

    # ============================================================
    #  STEP 3  —  Install Cordova globally
    # ============================================================
    - name: Install Cordova ${{ env.CORDOVA_VERSION }}
      run: |
        npm install -g cordova@${{ env.CORDOVA_VERSION }}
        cordova --version

    # ============================================================
    #  STEP 4  —  Setup JDK 17 (Temurin) — PRIMARY Java
    #  Used by: sdkmanager, aapt2, d8, build-tools
    #  setup-java@v5 sets JAVA_HOME to this JDK.
    # ============================================================
    - name: Setup JDK 17 (Temurin) — SDK tools
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Verify JDK 17 is default
      run: |
        echo "JAVA_HOME = $JAVA_HOME"
        java -version
        # Confirm class file version is 61.0 (JDK 17)
        javap -verbose java.lang.Object 2>/dev/null | grep "major version" || true

    # ============================================================
    #  STEP 5  —  Setup JDK 8 (Zulu) — Cordova/Gradle only
    #  setup-java@v5 auto-sets JAVA_HOME_8_X64 env var.
    #  We capture it IMMEDIATELY before it gets overwritten.
    #  NOTE: do NOT pass 'java-home-output-variable' — it's not a valid input.
    # ============================================================
    - name: Setup JDK 8 (Zulu) — Cordova/Gradle
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Save JDK 8 path & restore JDK 17 as default
      run: |
        # setup-java@v5 sets JAVA_HOME_8_X64 for the JDK 8 install
        echo "JDK8_HOME=$JAVA_HOME_8_X64" >> $GITHUB_ENV
        echo "JDK 8 path saved: $JAVA_HOME_8_X64"

        # Revert JAVA_HOME to JDK 17 for all subsequent steps
        echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
        echo "JAVA_HOME restored to JDK 17: $JAVA_HOME_17_X64"

    # ============================================================
    #  STEP 6  —  Install Android SDK command-line tools
    #  CRITICAL: JAVA_HOME must be JDK 17 here (sdkmanager needs it).
    #  We use cmdline-tools 11.0 (build 10406996) — stable, JDK 17 OK.
    #  PATH is exported inline (for THIS step) AND written to
    #  $GITHUB_PATH (for ALL future steps).
    # ============================================================
    - name: Install Android SDK command-line tools
      run: |
        set -e

        # Force JDK 17 for THIS step
        export JAVA_HOME="$JAVA_HOME_17_X64"

        # --- Paths ---
        ANDROID_HOME="$HOME/android-sdk"
        TOOLS_DIR="$ANDROID_HOME/cmdline-tools/tools"
        BIN_DIR="$TOOLS_DIR/bin"

        # Persist for all future steps
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

        # --- Download cmdline-tools 11.0 ---
        echo "=== Downloading cmdline-tools 11.0 ==="
        wget -q --show-progress \
          https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip \
          -O /tmp/cmdline-tools.zip

        # --- Extract ---
        echo "=== Extracting ==="
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools/"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$TOOLS_DIR"
        rm -f /tmp/cmdline-tools.zip

        # --- Make binaries executable ---
        chmod +x "$BIN_DIR"/*
        chmod +x "$ANDROID_HOME/cmdline-tools/tools/bin"/*

        # --- Add to PATH for FUTURE steps ---
        echo "$BIN_DIR"                     >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

        # --- Add to PATH for THIS step (inline export) ---
        export PATH="$BIN_DIR:$ANDROID_HOME/platform-tools:$PATH"

        # --- Verify sdkmanager exists & is executable ---
        echo "=== sdkmanager location ==="
        ls -la "$BIN_DIR/sdkmanager"
        which sdkmanager || true

        echo "=== sdkmanager version (must run on JDK 17) ==="
        java -version 2>&1
        "$BIN_DIR/sdkmanager" --version

    # ============================================================
    #  STEP 7  —  Accept licenses & install SDK packages
    #  sdkmanager is now on PATH via GITHUB_PATH.
    #  JAVA_HOME is still JDK 17 (from env persistence).
    # ============================================================
    - name: Accept SDK licenses & install packages
      run: |
        set -e

        # Double-check JDK 17
        export JAVA_HOME="$JAVA_HOME_17_X64"
        export PATH="$HOME/android-sdk/cmdline-tools/tools/bin:$HOME/android-sdk/platform-tools:$PATH"

        echo "=== Java version (should be 17) ==="
        java -version 2>&1

        echo "=== Accepting all SDK licenses ==="
        yes | sdkmanager --licenses > /dev/null 2>&1 || true

        echo "=== Installing SDK packages ==="
        sdkmanager \
          "platforms;android-${{ env.ANDROID_API }}" \
          "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" \
          "platform-tools"

        echo "=== Installed SDK ==="
        ls -la "$ANDROID_HOME/"
        ls -la "$ANDROID_HOME/platforms/" 2>/dev/null || true

    # ============================================================
    #  STEP 8  —  Generate app icons & splash screens (Python)
    # ============================================================
    - name: Generate icon & splash resources
      run: |
        mkdir -p res/icon/android res/screen/android

        python3 << 'PYEOF'
        from PIL import Image, ImageDraw

        # --- Icons ---
        sizes = {'ldpi': 36, 'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144}
        for density, size in sizes.items():
            img = Image.new('RGBA', (size, size), (26, 26, 26, 255))
            d = ImageDraw.Draw(img)
            m = size // 6
            d.rounded_rectangle([m, size//3, size-m, size*2//3],
                                radius=size//8, fill=(200, 200, 0, 255))
            cl, cr = size//3, size*2//3
            d.polygon([(cl, size//3), (cr, size//3),
                       (cr-size//8, m), (cl+size//8, m)],
                      fill=(255, 255, 80, 255))
            wr = size // 8
            for wx in [size//4, size*3//4]:
                wy = size*2//3
                d.ellipse([wx-wr, wy-wr//2, wx+wr, wy+wr//2], fill=(30, 30, 30, 255))
                d.ellipse([wx-wr//2, wy-wr//3, wx+wr//2, wy+wr//3], fill=(150, 150, 150, 255))
            img.save(f'res/icon/android/{density}.png')
            print(f'Icon: {density}.png ({size}x{size})')

        # --- Splash screens ---
        for density, w, h in [('mdpi', 320, 480), ('hdpi', 480, 800),
                              ('xhdpi', 720, 1280), ('xxhdpi', 1080, 1920)]:
            img = Image.new('RGBA', (w, h), (26, 26, 46, 255))
            d = ImageDraw.Draw(img)
            cx, cy = w//2, h//3
            d.rounded_rectangle([cx-w//4, cy-h//8, cx+w//4, cy+h//8],
                                radius=h//16, fill=(0, 200, 200, 255))
            car_y = h//2
            cw = w // 3
            cx0 = cx - cw//2
            d.rounded_rectangle([cx0, car_y, cx0+cw, car_y+cw//3],
                                radius=cw//8, fill=(200, 200, 0, 255))
            d.polygon([(cx0+cw//4, car_y), (cx0+cw*3//4, car_y),
                       (cx0+cw*5//8, car_y-cw//4), (cx0+cw*3//8, car_y-cw//4)],
                      fill=(255, 255, 80, 255))
            for wx in [cx0+cw//4, cx0+cw*3//4]:
                r = cw // 8
                d.ellipse([wx-r, car_y+cw//4-r, wx+r, car_y+cw//4+r], fill=(30, 30, 30, 255))
            d.rectangle([0, h*3//4, w, h], fill=(20, 20, 20, 255))
            img.save(f'res/screen/android/splash-{density}.png')
            print(f'Splash: {density} ({w}x{h})')

        print('Done!')
        PYEOF

    # ============================================================
    #  STEP 9  —  Initialize Cordova Android project
    # ============================================================
    - name: Initialize Cordova Android project
      run: |
        set -e
        cordova create app com.zxkitcar.sim "ZXKitCarSim"
        cp config.xml app/config.xml
        cd app
        cordova platform add android@8.1.0
        cordova plugin add cordova-plugin-whitelist@1.3.4
        cordova plugin add cordova-plugin-statusbar@2.4.3
        echo "=== Project structure ==="
        ls -la
        ls -la platforms/android/

    # ============================================================
    #  STEP 10  —  Copy web assets into www/
    # ============================================================
    - name: Copy web assets to www/
      run: |
        set -e
        mkdir -p app/www
        cp index.html   app/www/
        cp game.js      app/www/
        cp server.js    app/www/
        cp package.json app/www/
        echo "--- app/www/ contents ---"
        ls -la app/www/

    # ============================================================
    #  STEP 11  —  Build Debug APK
    #  JAVA_HOME → JDK 8 (Gradle 4.x needs JDK 8)
    #  ANDROID_HOME → our manually installed SDK
    # ============================================================
    - name: Build Debug APK
      working-directory: app
      env:
        JAVA_HOME:    ${{ env.JDK8_HOME }}
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
      run: |
        set -e
        echo "Building with JAVA_HOME=$JAVA_HOME"
        java -version
        cordova build android --debug

    # ============================================================
    #  STEP 12  —  Build Release APK (unsigned)
    # ============================================================
    - name: Build Release APK (unsigned)
      working-directory: app
      env:
        JAVA_HOME:    ${{ env.JDK8_HOME }}
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
      run: |
        set -e
        echo "Building with JAVA_HOME=$JAVA_HOME"
        cordova build android --release

    # ============================================================
    #  STEP 13  —  Locate APKs and copy to artifacts/
    # ============================================================
    - name: Find and prepare APK artifacts
      run: |
        set -e
        mkdir -p artifacts

        echo "=== Searching for APKs ==="
        find app -name "*.apk" -type f 2>/dev/null

        # Debug
        DEBUG_APK=$(find app/platforms/android/app/build/outputs/apk/debug \
          -name "*.apk" 2>/dev/null | head -1)
        if [ -n "$DEBUG_APK" ]; then
          cp "$DEBUG_APK" artifacts/zx-kitcar-sim-v6.0-debug.apk
          echo "Debug APK: $DEBUG_APK"
        else
          echo "Debug APK not found!"
          ls -laR app/platforms/android/app/build/ 2>/dev/null | head -40
        fi

        # Release
        REL_APK=$(find app/platforms/android/app/build/outputs/apk/release \
          -name "*.apk" 2>/dev/null | head -1)
        if [ -n "$REL_APK" ]; then
          cp "$REL_APK" artifacts/zx-kitcar-sim-v6.0-release-unsigned.apk
          echo "Release APK: $REL_APK"
        else
          echo "Release APK not found!"
          ls -laR app/platforms/android/app/build/ 2>/dev/null | head -40
        fi

        echo "=== Artifacts ==="
        ls -lh artifacts/ 2>/dev/null

    # ============================================================
    #  STEP 14  —  Upload APKs as GitHub Artifacts (upload-artifact@v4)
    # ============================================================
    - name: Upload Debug APK
      if: hashFiles('artifacts/zx-kitcar-sim-v6.0-debug.apk') != ''
      uses: actions/upload-artifact@v4
      with:
        name: zx-kitcar-sim-debug-apk
        path: artifacts/zx-kitcar-sim-v6.0-debug.apk
        retention-days: 30

    - name: Upload Release APK
      if: hashFiles('artifacts/zx-kitcar-sim-v6.0-release-unsigned.apk') != ''
      uses: actions/upload-artifact@v4
      with:
        name: zx-kitcar-sim-release-apk
        path: artifacts/zx-kitcar-sim-v6.0-release-unsigned.apk
        retention-days: 30

    # ============================================================
    #  STEP 15  —  On tag push: create GitHub Release
    # ============================================================
    - name: Package Release zip
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        set -e
        cd artifacts
        zip zx-kitcar-sim-v6.0-android.zip \
            zx-kitcar-sim-v6.0-debug.apk \
            zx-kitcar-sim-v6.0-release-unsigned.apk
        ls -lh zx-kitcar-sim-v6.0-android.zip

    - name: Upload to GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/zx-kitcar-sim-v6.0-debug.apk
          artifacts/zx-kitcar-sim-v6.0-release-unsigned.apk
          artifacts/zx-kitcar-sim-v6.0-android.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ============================================================
    #  STEP 16  —  Build Summary
    # ============================================================
    - name: Build Summary
      if: always()
      run: |
        echo "============================================"
        echo "  Citroen ZX Kit Car Rally Sim v6.0"
        echo "  Build Complete!"
        echo "============================================"
        echo ""
        echo "APK Files:"
        ls -lh artifacts/*.apk 2>/dev/null || echo "  (no APKs found)"
        echo ""
        echo "Install debug APK:"
        echo "  adb install -r artifacts/zx-kitcar-sim-v6.0-debug.apk"
        echo ""
        echo "--- Environment ---"
        echo "Node.js:           18 (LTS)"
        echo "Cordova:           ${{ env.CORDOVA_VERSION }}"
        echo "Cordova-Android:   8.1.0 (API 19-28)"
        echo "Android Target:    API ${{ env.ANDROID_API }}"
        echo "JDK for Cordova:   8  (Zulu)   <- JDK8_HOME"
        echo "JDK for SDK tools: 17 (Temurin) <- JAVA_HOME"
        echo "============================================"
