name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ""          # ✅ 消除 NDK 警告

    steps:
      # ── 1. Checkout ──────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Node.js 18 ───────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ── 3. JDK 17 默认 (SDK 工具用) ──────────
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup JDK 8 (Cordova build only)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Lock JAVA_HOME + save JDK8
        run: |
          echo "JDK8_HOME=$JAVA_HOME_8_X64" >> $GITHUB_ENV
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV

      # ── 4. 安装 Gradle 4.10.3 ─────────────────
      - name: Install Gradle 4.10.3
        run: |
          cd /tmp
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
          sudo unzip -q gradle.zip -d /opt/
          rm gradle.zip
          echo "/opt/gradle-4.10.3/bin" >> $GITHUB_PATH
          gradle -v

      # ── 5. 安装 Pillow ─────────────────────────
      - name: Install Pillow
        run: pip install --quiet "Pillow==10.4.0"

      # ── 6. Android SDK ─────────────────────────
      - name: Setup Android SDK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
          unzip -q cmdtools.zip
          mv cmdline-tools tools
          rm cmdtools.zip
          BIN=$ANDROID_HOME/cmdline-tools/tools/bin
          echo "$BIN" >> $GITHUB_PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          export PATH="$BIN:$PATH"
          "$BIN/sdkmanager" --version

      - name: Install SDK packages
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          BIN=$ANDROID_HOME/cmdline-tools/tools/bin
          yes | "$BIN/sdkmanager" --licenses >/dev/null
          "$BIN/sdkmanager" "platform-tools" "platforms;android-28" "build-tools;28.0.3"

      # ── 7. Cordova ─────────────────────────────
      - name: Install Cordova
        run: npm install -g cordova@8.1.2

      - name: Init Cordova project
        run: |
          cordova create app com.zxkitcar.sim ZX_KitCar_Sim
          mkdir -p app/www
          cp www/* app/www/ 2>/dev/null || true
          cp index.html app/www/ 2>/dev/null || true
          cp game.js app/www/ 2>/dev/null || true

      # ── 8. 生成图标/启动屏 ────────────────────
      - name: Generate icons & splash
        working-directory: app
        run: |
          mkdir -p res/icon/android res/screen/android
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw
          sizes = {'ldpi':36,'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144}
          for d,s in sizes.items():
              img=Image.new('RGBA',(s,s),(26,26,26,255)); dr=ImageDraw.Draw(img); m=s//6
              dr.rounded_rectangle([m,s//3,s-m,s*2//3],radius=s//8,fill=(200,200,0,255))
              dr.polygon([(s//3,s//3),(s*2//3,s//3),(s*2//3-s//8,m),(s//3+s//8,m)],fill=(255,255,80,255))
              for wx in [s//4,s*3//4]:
                  dr.ellipse([wx-s//8,s*2//3-s//16,wx+s//8,s*2//3+s//16],fill=(30,30,30,255))
              img.save(f"res/icon/android/{d}.png")
          for d,w,h in [('mdpi',320,480),('hdpi',480,800),('xhdpi',720,1280),('xxhdpi',1080,1920)]:
              img=Image.new('RGBA',(w,h),(26,26,46,255)); dr=ImageDraw.Draw(img)
              cx,cy=w//2,h//3
              dr.rounded_rectangle([cx-w//4,cy-h//8,cx+w//4,cy+h//8],radius=h//16,fill=(0,200,200,255))
              cw=w//3; cx0=cx-cw//2; cy2=h//2
              dr.rounded_rectangle([cx0,cy2,cx0+cw,cy2+cw//3],radius=cw//8,fill=(200,200,0,255))
              dr.polygon([(cx0+cw//4,cy2),(cx0+cw*3//4,cy2),(cx0+cw*5//8,cy2-cw//4),(cx0+cw*3//8,cy2-cw//4)],fill=(255,255,80,255))
              for wx in [cx0+cw//4,cx0+cw*3//4]:
                  r=cw//8; dr.ellipse([wx-r,cy2+cw//4-r,wx+r,cy2+cw//4+r],fill=(30,30,30,255))
              dr.rectangle([0,h*3//4,w,h],fill=(20,20,20,255))
              img.save(f"res/screen/android/splash-{d}.png")
          print("Done!")
          PYEOF

      # ── 9. Add Android platform ───────────────
      - name: Add Android platform
        working-directory: app
        run: |
          export JAVA_HOME="$JAVA_HOME_8_X64"
          cordova platform add android@8.1.0

      # ── 10. ✅ 只改 wrapper URL，不动 build.gradle ──
      - name: Fix Gradle wrapper version only
        working-directory: app/platforms/android
        run: |
          find . -name "gradle-wrapper.properties" -exec sed -i \
            's|https://services.gradle.org/distributions/gradle-.*-bin.zip|https://services.gradle.org/distributions/gradle-4.10.3-bin.zip|g' {} \;

      # ── 11. Build Debug ─────────────────────────
      - name: Build Debug APK
        working-directory: app
        run: |
          export JAVA_HOME="$JAVA_HOME_8_X64"
          export PATH="/opt/gradle-4.10.3/bin:$PATH"
          export CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
          cordova build android --debug \
            -- --no-daemon \
            -PcdvMinSdkVersion=19 \
            -PcdvTargetSdkVersion=28
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── 12. Build Release ───────────────────────
      - name: Build Release APK
        working-directory: app
        run: |
          export JAVA_HOME="$JAVA_HOME_8_X64"
          export PATH="/opt/gradle-4.10.3/bin:$PATH"
          export CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
          cordova build android --release \
            -- --no-daemon \
            -PcdvMinSdkVersion=19 \
            -PcdvTargetSdkVersion=28
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── 13. 定位 APK ───────────────────────────
      - name: Locate and copy APKs
        run: |
          mkdir -p artifacts
          DBG=$(find app -name "*debug*.apk" | head -1)
          if [ -n "$DBG" ]; then cp "$DBG" artifacts/debug.apk; fi
          REL=$(find app -name "*release*.apk" | head -1)
          if [ -n "$REL" ]; then cp "$REL" artifacts/release-unsigned.apk; fi
          ls -la artifacts/

      # ── 14. Upload ──────────────────────────────
      - uses: actions/upload-artifact@v4
        with:
          name: zx-kitcar-debug-apk
          path: artifacts/debug.apk
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: zx-kitcar-release-apk
          path: artifacts/release-unsigned.apk
          if-no-files-found: warn
